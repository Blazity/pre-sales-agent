version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      claude-agent-sdk:
        patterns:
          - "@anthropic-ai/claude-agent-sdk"
      anthropic-sdk:
        patterns:
          - "@anthropic-ai/sdk"
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/sdk"
      slack-sdk:
        patterns:
          - "@slack/*"
      vector-database:
        patterns:
          - "@pinecone-database/pinecone"
      document-parsing:
        patterns:
          - "mammoth"
      validation:
        patterns:
          - "zod"
      vercel-workflow-runtime:
        patterns:
          - "@vercel/sandbox"
          - "workflow"
      runtime-support:
        patterns:
          - "dotenv"
          - "express"
          - "open"
          - "undici"
      typescript-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "undici"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
